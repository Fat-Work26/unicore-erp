{% extends 'layoutes/base_public.html' %}

{% block title %}تسجيل الدخول - Unicore ERP{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-lg border border-gray-100">
    <h2 class="text-2xl font-bold text-[#0f172a] text-center mb-6">تسجيل الدخول</h2>
    
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">اسم المستخدم</label>
            <input type="text" name="username" id="" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-[#0f172a] focus:ring-1 focus:ring-[#0f172a]">
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">كلمة المرور</label>
            <input type="password" name="password" id="" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-[#0f172a] focus:ring-1 focus:ring-[#0f172a]">
        </div>

        <button type="submit" class="w-full bg-[#0f172a]  text-white py-2 rounded-lg font-semibold hover:bg-[#1e293b] transition">
            دخول
        </button>
    </form>
</div>

{% endblock %}
