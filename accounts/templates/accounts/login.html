{% extends 'layoutes/base_public.html' %}

{% block title %}تسجيل الدخول - Unicore ERP{% endblock %}

{% block content %}


<div class="container d-flex justify-content-center align-items-center min-vh-100" dir="rtl">
  <div class="col-12 col-md-6 col-lg-4">
    
   
    <div class="card p-4 shadow-lg border-0 ">
      
      <h3 class="text-center mb-4 fw-bold">تسجيل الدخول</h3>

      <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
          <label for="exampleInputEmail1" class="form-label">البريد الإلكتروني أو رقم التسجيل</label>
          <input type="text" name ="username" class="form-control   border-2" id="exampleInputEmail1" aria-describedby="emailHelp">
          <div id="emailHelp" class="form-text text-secondary">لن نشارك بريدك الإلكتروني مع أي جهة أخرى.</div>
        </div>

        <div class="mb-3">
          <label for="exampleInputPassword1" class="form-label">كلمة المرور</label>
          <input type="password"name="password" class="form-control border-2" id="exampleInputPassword1">
        </div>

        

        
        <button type="submit" class="btn text-glow bg-dark fw-bold w-100" >تسجيل الدخول</button>
      </form>
       <p class="signup-link">
        هل نسيت كلمة المرور؟
        <a href="#" class="signup-link link"> من هنا</a>
      </p>
    </div>

  </div>
</div>









{% endblock %}
